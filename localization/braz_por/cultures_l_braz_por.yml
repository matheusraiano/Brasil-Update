l_braz_por:
 # New Brazilian Cultures
 mineiro:0 "Mineiro"
 mineiro_desc:0 "Os mineiros desenvolveram uma identidade cultural única centrada na mineração e no barroco colonial. A busca pelo ouro moldou a sociedade de Minas Gerais, criando uma cultura com forte tradição católica, arquitetura ornamentada e um senso de independência que levaria a movimentos como a Inconfidência Mineira."

 carioca:0 "Carioca"
 carioca_desc:0 "A cultura carioca se desenvolveu no Rio de Janeiro, capital do Império e centro cosmopolita do Brasil. Influenciada pela corte portuguesa e pela vida urbana, os cariocas têm forte apreço pela cultura, artes e pela vida social. O Rio foi o coração político e cultural do país durante todo o período imperial."

 sertanejo:0 "Sertanejo"
 sertanejo_desc:0 "Os sertanejos habitam o interior do Brasil, especialmente as áreas de cerrado e sertão. Sua cultura é marcada pela adaptação ao clima seco, pela pecuária e agricultura de subsistência, e por forte tradição oral. Distantes dos centros urbanos litorâneos, desenvolveram costumes e dialetos próprios."
