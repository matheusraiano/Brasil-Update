 # Scripted Button Names
 je_brazilian_nation_building_integrate_mineiro:0 "Integrar os Mineiros"
 je_brazilian_nation_building_integrate_mineiro_past_tense:0 "Mineiros Integrados"
 je_brazilian_nation_building_integrate_mineiro_desc:0 "Os mineiros de Minas Gerais desenvolveram uma identidade cultural própria baseada na mineração e no barroco colonial. Para integrá-los à nação brasileira, devemos fortalecer nossa identidade cultural comum e demonstrar que compartilhamos os mesmos valores nacionais."

 je_brazilian_nation_building_integrate_carioca:0 "Integrar os Cariocas"
 je_brazilian_nation_building_integrate_carioca_past_tense:0 "Cariocas Integrados"
 je_brazilian_nation_building_integrate_carioca_desc:0 "Os cariocas da capital Rio de Janeiro são a elite cosmopolita do Império, com forte ligação à corte portuguesa. Sua integração simboliza a união entre o poder imperial e a identidade brasileira emergente."

 je_brazilian_nation_building_integrate_sertanejo:0 "Integrar os Sertanejos"
 je_brazilian_nation_building_integrate_sertanejo_past_tense:0 "Sertanejos Integrados"
 je_brazilian_nation_building_integrate_sertanejo_desc:0 "Os sertanejos do interior brasileiro, adaptados ao cerrado e ao sertão, mantêm tradições e dialetos próprios. Conectar estas regiões remotas à nação através de infraestrutura e desenvolvimento econômico é essencial para sua integração."

 # Button Requirements Tooltips
 je_brazilian_nation_building_mineiro_gold_mines:0 "Minas Gerais possui minas de ouro desenvolvidas (nível 10+)"
 je_brazilian_nation_building_carioca_capital_infrastructure:0 "O Rio de Janeiro possui universidades (nível 5+) ou administração governamental (nível 10+)"
 je_brazilian_nation_building_sertanejo_development:0 "Estados sertanejos possuem ferrovias (nível 3+) ou fazendas de gado (nível 5+)"

 # Integration Effect Tooltips
 je_brazilian_nation_building_integrate_mineiro_removal_tt:0 "Minas Gerais deixa de ser homeland da cultura mineira"
 je_brazilian_nation_building_integrate_mineiro_tt:0 "Todos os mineiros se tornam brasileiros"

 je_brazilian_nation_building_integrate_carioca_removal_tt:0 "Rio de Janeiro deixa de ser homeland da cultura carioca"
 je_brazilian_nation_building_integrate_carioca_tt:0 "Todos os cariocas se tornam brasileiros"

 je_brazilian_nation_building_integrate_sertanejo_removal_tt:0 "Estados do interior deixam de ser homeland da cultura sertaneja"
 je_brazilian_nation_building_integrate_sertanejo_tt:0 "Todos os sertanejos se tornam brasileiros"

